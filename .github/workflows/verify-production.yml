name: Production public site browser
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-public-browser
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install locked verifier dependencies
        working-directory: site
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Chromium browser
        working-directory: site
        run: |
          set -euo pipefail
          sudo "$(command -v bun)" ../scripts/browser-acquisition.ts
          config=/etc/apt/apt.conf.d/99-browser-acquisition
          sudo test ! -e "$config"
          sudo test ! -L "$config"
          trap 'sudo rm -f "$config"' EXIT
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "1";' | sudo tee "$config" >/dev/null
          bun node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Inspect public production pages without writes
        run: bun site/scripts/check-production-browser.mjs
      - name: Retain production screenshots and receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-public-browser
          path: site/.production-browser/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  required:
    name: Required
    if: always()
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require live public browser verification
        env:
          RESULT: ${{ needs.browser.result }}
        run: test "$RESULT" = success
