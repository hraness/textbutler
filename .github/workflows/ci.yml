name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer PR push supersedes the older PR run. Main pushes get one group per
# SHA and are never cancelled, so site promotion always finds complete
# attempt-1 CI for the exact commit it admits.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            site:
              - "site/**"
              - "README.md"
              - "docs/methodology.md"
              - "docs/research.md"
              - ".github/workflows/ci.yml"
            native:
              - "src/**"
              - "packages/**"
              - "scripts/**"
              - "native/**"
              - "schema/**"
              - "dist/**"
              - "package.json"
              - "bun.lock"
              - "bunfig.toml"
              - "tsconfig.json"
              - "tsconfig.build.json"
              - ".github/workflows/ci.yml"

  check:
    name: Standalone package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - name: Restore Bun install cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      # Standalone saves the root install cache on main; the other root jobs
      # restore it and PR runs never save.
      - name: Save Bun install cache on main
        if: github.event_name == 'push' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - run: bun run check:cost-surfaces
      - run: bun run typecheck
      - run: bun run check:effect
      - run: bun run check:skill
      - run: bun run check:standalone
      - run: bun run build
      - run: bun run check:public-graphs
      - run: bun run check:dist
      - run: bun run check:package
      - name: Verify checked distribution and lockfile
        run: |
          set -euo pipefail
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - name: Restore Bun install cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test

  textbutler:
    name: Textbutler packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - name: Restore Bun install cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      # Runs the package tests as balanced parallel lanes plus both typechecks
      # (scripts/check-textbutler.ts); the job name stays in the site
      # promotion's CI inventory.
      - run: bun scripts/check-textbutler.ts

  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      # The site installs only site/bun.lock, so it keeps its own cache family.
      - name: Restore Bun install cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-site-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: |
            bun-site-${{ runner.os }}-
            bun-${{ runner.os }}-
      - name: Restore Next.js build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}-
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: site
      - name: Save Bun install cache on main
        if: github.event_name == 'push' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - run: bun run sync:readme
        working-directory: site
      - run: bun run test
        working-directory: site
      - run: bun run lint
        working-directory: site
      - run: bun run build
        working-directory: site
      - name: Install the pinned candidate browser
        working-directory: site
        run: |
          set -euo pipefail
          sudo "$(command -v bun)" ../scripts/browser-acquisition.ts
          config=/etc/apt/apt.conf.d/99-browser-acquisition
          sudo test ! -e "$config"
          sudo test ! -L "$config"
          trap 'sudo rm -f "$config"' EXIT
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "1";' | sudo tee "$config" >/dev/null
          bun node_modules/playwright-core/cli.js install --with-deps --no-shell chromium
      - name: Check the committed informational site in Chromium
        working-directory: site
        run: |
          export TEXTBUTLER_NODE_EXECUTABLE="$(command -v node)"
          export TEXTBUTLER_BROWSER_EXECUTABLE="$(bun -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath())')"
          bun run check:browser
      - name: Retain candidate screenshots and receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informational-site-browser
          path: |
            site/.browser-artifacts/*/*.png
            site/.browser-artifacts/*/receipt.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      # Main saves the warm compile cache that PRs and the site promotion
      # restore; PR runs never save, so they cannot churn or evict it.
      - name: Save Next.js build cache on main
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}-${{ github.sha }}
      - name: Verify generated README view
        run: git diff --exit-code -- site/app/readme.generated.ts site/app/methodology.generated.ts site/app/research.generated.ts

  macos_fixtures:
    name: macOS synthetic Messages and Contacts fixtures
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Restore Bun install cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Save Bun install cache on main
        if: github.event_name == 'push' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - name: Test generated fixtures with an isolated home
        env:
          HOME: ${{ runner.temp }}/message-like-me-fixture-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          bun test src/imessage.test.ts src/contacts.test.ts src/metrics.test.ts
      # The package typechecks are platform-independent and run in the Linux
      # "Textbutler packages" job, so macOS runs only the package tests.
      - name: Test Textbutler owner controls and native custody with synthetic data
        run: bun scripts/check-textbutler.ts --tests-only
      - name: Verify native app supervision with synthetic data
        run: bun scripts/verify-textbutler-macos-app.ts

  required:
    name: Required
    if: always()
    needs: [changes, check, test, textbutler, site, macos_fixtures]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every blocking job to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEXTBUTLER_RESULT: ${{ needs.textbutler.result }}
          SITE_RESULT: ${{ needs.site.result }}
          SITE_CHANGED: ${{ needs.changes.outputs.site }}
          MACOS_RESULT: ${{ needs.macos_fixtures.result }}
          NATIVE_CHANGED: ${{ needs.changes.outputs.native }}
        run: |
          set -euo pipefail
          failed=0
          require_success() {
            if [[ "$2" != "success" ]]; then
              echo "::error::$1 finished with result '$2'"
              failed=1
            fi
          }
          require_success_or_filtered_skip() {
            if [[ "$2" == "success" ]]; then
              return
            fi
            if [[ "$2" == "skipped" && "$3" == "false" ]]; then
              echo "$1 skipped because its inputs did not change"
              return
            fi
            echo "::error::$1 finished with result '$2' (inputs changed: '$3')"
            failed=1
          }
          require_success "Detect changed paths" "$CHANGES_RESULT"
          require_success "Standalone package" "$CHECK_RESULT"
          require_success "Tests" "$TEST_RESULT"
          require_success "Textbutler packages" "$TEXTBUTLER_RESULT"
          require_success_or_filtered_skip "Site" "$SITE_RESULT" "$SITE_CHANGED"
          require_success_or_filtered_skip "macOS synthetic Messages and Contacts fixtures" "$MACOS_RESULT" "$NATIVE_CHANGED"
          exit "$failed"
