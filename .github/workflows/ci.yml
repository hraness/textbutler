name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            site:
              - "site/**"
              - "README.md"
              - "docs/methodology.md"
              - "docs/research.md"
              - ".github/workflows/ci.yml"
            native:
              - "src/**"
              - "packages/**"
              - "scripts/**"
              - "native/**"
              - "schema/**"
              - "dist/**"
              - "package.json"
              - "bun.lock"
              - "bunfig.toml"
              - "tsconfig.json"
              - "tsconfig.build.json"
              - ".github/workflows/ci.yml"

  check:
    name: Standalone package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Restore Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:cost-surfaces
      - run: bun run typecheck
      - run: bun run check:effect
      - run: bun run check:skill
      - run: bun run check:standalone
      - run: bun run build
      - run: bun run check:public-graphs
      - run: bun run check:dist
      - run: bun run check:package
      - name: Verify checked distribution and lockfile
        run: |
          set -euo pipefail
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Restore Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test

  textbutler:
    name: Textbutler packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Restore Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:textbutler

  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Restore Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}-
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: site
      - run: bun run sync:readme
        working-directory: site
      - run: bun run test
        working-directory: site
      - run: bun run lint
        working-directory: site
      - run: bun run build
        working-directory: site
      - name: Verify generated README view
        run: git diff --exit-code -- site/app/readme.generated.ts site/app/methodology.generated.ts site/app/research.generated.ts

  macos_fixtures:
    name: macOS synthetic Messages and Contacts fixtures
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Restore Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Test generated fixtures with an isolated home
        env:
          HOME: ${{ runner.temp }}/message-like-me-fixture-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          bun test src/imessage.test.ts src/contacts.test.ts src/metrics.test.ts
      - name: Test Textbutler owner controls and native custody with synthetic data
        run: bun run check:textbutler
      - name: Verify native app supervision with synthetic data
        run: bun scripts/verify-textbutler-macos-app.ts

  required:
    name: Required
    if: always()
    needs: [changes, check, test, textbutler, site, macos_fixtures]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every blocking job to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEXTBUTLER_RESULT: ${{ needs.textbutler.result }}
          SITE_RESULT: ${{ needs.site.result }}
          SITE_CHANGED: ${{ needs.changes.outputs.site }}
          MACOS_RESULT: ${{ needs.macos_fixtures.result }}
          NATIVE_CHANGED: ${{ needs.changes.outputs.native }}
        run: |
          set -euo pipefail
          failed=0
          require_success() {
            if [[ "$2" != "success" ]]; then
              echo "::error::$1 finished with result '$2'"
              failed=1
            fi
          }
          require_success_or_filtered_skip() {
            if [[ "$2" == "success" ]]; then
              return
            fi
            if [[ "$2" == "skipped" && "$3" == "false" ]]; then
              echo "$1 skipped because its inputs did not change"
              return
            fi
            echo "::error::$1 finished with result '$2' (inputs changed: '$3')"
            failed=1
          }
          require_success "Detect changed paths" "$CHANGES_RESULT"
          require_success "Standalone package" "$CHECK_RESULT"
          require_success "Tests" "$TEST_RESULT"
          require_success "Textbutler packages" "$TEXTBUTLER_RESULT"
          require_success_or_filtered_skip "Site" "$SITE_RESULT" "$SITE_CHANGED"
          require_success_or_filtered_skip "macOS synthetic Messages and Contacts fixtures" "$MACOS_RESULT" "$NATIVE_CHANGED"
          exit "$failed"
