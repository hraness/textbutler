name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Standalone package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: site
      - run: bun run sync:readme
        working-directory: site
      - run: bun run test
        working-directory: site
      - run: bun run lint
        working-directory: site
      - run: bun run build
        working-directory: site
      - name: Verify generated README view
        run: git diff --exit-code -- site/app/readme.generated.ts site/app/methodology.generated.ts site/app/research.generated.ts
      - name: Verify checked distribution and lockfile
        run: |
          set -euo pipefail
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi

  macos_fixtures:
    name: macOS synthetic Messages and Contacts fixtures
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Test generated fixtures with an isolated home
        env:
          HOME: ${{ runner.temp }}/message-like-me-fixture-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          bun test src/imessage.test.ts src/contacts.test.ts src/metrics.test.ts
