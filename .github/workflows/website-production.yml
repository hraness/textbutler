        run: |
          set -euo pipefail
          sha256sum --check <<'SITE_AUTHORITY_HASHES'
          2694b0fcd4238da26cfb64eff15436e55fc16a7f04dd3f29083cc2bd5a024c4e  scripts/release-app-token.mjs
          efeb5bd9979315fda0e9b6d8e1b64d60ca363b79ec1c290204c90a4be25dc30c  scripts/release-status-attester.mjs
          6a1ee1d3a869a1e91c003f97270a81c35860b81fb73fb2c462c786f7916437ff  scripts/release-production-authority.mjs
          876c176fd0d203a091e8e6a819fc1656826c04a6d02a653b6b470aa8db641e7d  scripts/release-provider-outcome.mjs
          38c3f102b475b47bc4823060c13270234664b50d56160015e31cc4a224268591  scripts/release-ref-writer.mjs
          50f9feefba8aad4a831ab5ae1d3ac3e029f1b721cd813400742c82c7c6980df7  scripts/release-workflow-range.mjs
          bf7b7c1ec00cf2b61a4736a7ac25e244f12c9d70c3e25de9a2d2f66e30cbd91f  scripts/site-production-subject.mjs
          70dec16f999d28e3cb657c390094f1f82c26e0eaf034c05e4b46a8d8d72b3c4d  scripts/site-production.mjs
          SITE_AUTHORITY_HASHES
          node ./scripts/site-production.mjs deny
      - name: Attest one exact site target with the status-only App
        id: attest
        env:
          TARGET: ${{ inputs.site_sha }}
          MLM_RELEASE_APP_PRIVATE_KEY: ${{ secrets.MLM_RELEASE_APP_PRIVATE_KEY }}
          MLM_RELEASE_APP_CLIENT_ID: ${{ vars.MLM_RELEASE_APP_CLIENT_ID }}
          MLM_RELEASE_APP_ID: ${{ vars.MLM_RELEASE_APP_ID }}
          MLM_RELEASE_APP_INSTALLATION_ID: ${{ vars.MLM_RELEASE_APP_INSTALLATION_ID }}
          MLM_RELEASE_APP_SLUG: ${{ vars.MLM_RELEASE_APP_SLUG }}
        run: |
          set -euo pipefail
          sha256sum --check <<'SITE_AUTHORITY_HASHES'
          2694b0fcd4238da26cfb64eff15436e55fc16a7f04dd3f29083cc2bd5a024c4e  scripts/release-app-token.mjs
          efeb5bd9979315fda0e9b6d8e1b64d60ca363b79ec1c290204c90a4be25dc30c  scripts/release-status-attester.mjs
          6a1ee1d3a869a1e91c003f97270a81c35860b81fb73fb2c462c786f7916437ff  scripts/release-production-authority.mjs
          876c176fd0d203a091e8e6a819fc1656826c04a6d02a653b6b470aa8db641e7d  scripts/release-provider-outcome.mjs
          38c3f102b475b47bc4823060c13270234664b50d56160015e31cc4a224268591  scripts/release-ref-writer.mjs
          50f9feefba8aad4a831ab5ae1d3ac3e029f1b721cd813400742c82c7c6980df7  scripts/release-workflow-range.mjs
          bf7b7c1ec00cf2b61a4736a7ac25e244f12c9d70c3e25de9a2d2f66e30cbd91f  scripts/site-production-subject.mjs
          70dec16f999d28e3cb657c390094f1f82c26e0eaf034c05e4b46a8d8d72b3c4d  scripts/site-production.mjs
          SITE_AUTHORITY_HASHES
          node ./scripts/release-production-authority.mjs attest
      - name: Advance only the admitted site source with the exact old-ref lease
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          MLM_RELEASE_REF_TOKEN: ${{ github.token }}
          SITE_DENIAL_RECEIPT: ${{ steps.deny.outputs.receipt }}
          AUTHORITY_ATTESTATION_RECEIPT: ${{ steps.attest.outputs.receipt }}
        run: |
          set -euo pipefail
          sha256sum --check <<'SITE_AUTHORITY_HASHES'
          2694b0fcd4238da26cfb64eff15436e55fc16a7f04dd3f29083cc2bd5a024c4e  scripts/release-app-token.mjs
          efeb5bd9979315fda0e9b6d8e1b64d60ca363b79ec1c290204c90a4be25dc30c  scripts/release-status-attester.mjs
          6a1ee1d3a869a1e91c003f97270a81c35860b81fb73fb2c462c786f7916437ff  scripts/release-production-authority.mjs
          876c176fd0d203a091e8e6a819fc1656826c04a6d02a653b6b470aa8db641e7d  scripts/release-provider-outcome.mjs
          38c3f102b475b47bc4823060c13270234664b50d56160015e31cc4a224268591  scripts/release-ref-writer.mjs
          50f9feefba8aad4a831ab5ae1d3ac3e029f1b721cd813400742c82c7c6980df7  scripts/release-workflow-range.mjs
          bf7b7c1ec00cf2b61a4736a7ac25e244f12c9d70c3e25de9a2d2f66e30cbd91f  scripts/site-production-subject.mjs
          70dec16f999d28e3cb657c390094f1f82c26e0eaf034c05e4b46a8d8d72b3c4d  scripts/site-production.mjs
          SITE_AUTHORITY_HASHES
          node ./scripts/site-production.mjs promote
      - name: Consume site authority even when the attempt fails or is cancelled
        id: consume
        if: ${{ always() && steps.admitted.outcome == 'success' }}
        env:
          TARGET: ${{ inputs.site_sha }}
          MLM_RELEASE_APP_PRIVATE_KEY: ${{ secrets.MLM_RELEASE_APP_PRIVATE_KEY }}
          MLM_RELEASE_APP_CLIENT_ID: ${{ vars.MLM_RELEASE_APP_CLIENT_ID }}
          MLM_RELEASE_APP_ID: ${{ vars.MLM_RELEASE_APP_ID }}
          MLM_RELEASE_APP_INSTALLATION_ID: ${{ vars.MLM_RELEASE_APP_INSTALLATION_ID }}
          MLM_RELEASE_APP_SLUG: ${{ vars.MLM_RELEASE_APP_SLUG }}
          AUTHORITY_ATTESTATION_RECEIPT: ${{ steps.attest.outputs.receipt }}
          PROMOTION_RECEIPT_SHA256: ${{ steps.promote.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          sha256sum --check <<'SITE_AUTHORITY_HASHES'
          2694b0fcd4238da26cfb64eff15436e55fc16a7f04dd3f29083cc2bd5a024c4e  scripts/release-app-token.mjs
          efeb5bd9979315fda0e9b6d8e1b64d60ca363b79ec1c290204c90a4be25dc30c  scripts/release-status-attester.mjs
          6a1ee1d3a869a1e91c003f97270a81c35860b81fb73fb2c462c786f7916437ff  scripts/release-production-authority.mjs
          876c176fd0d203a091e8e6a819fc1656826c04a6d02a653b6b470aa8db641e7d  scripts/release-provider-outcome.mjs
          38c3f102b475b47bc4823060c13270234664b50d56160015e31cc4a224268591  scripts/release-ref-writer.mjs
          50f9feefba8aad4a831ab5ae1d3ac3e029f1b721cd813400742c82c7c6980df7  scripts/release-workflow-range.mjs
          bf7b7c1ec00cf2b61a4736a7ac25e244f12c9d70c3e25de9a2d2f66e30cbd91f  scripts/site-production-subject.mjs
          70dec16f999d28e3cb657c390094f1f82c26e0eaf034c05e4b46a8d8d72b3c4d  scripts/site-production.mjs
          SITE_AUTHORITY_HASHES
          node ./scripts/release-production-authority.mjs consume
      - name: Persist the public site-attempt receipts for interrupted-operation recovery
        id: evidence
        if: ${{ always() && steps.admitted.outcome == 'success' }}
        env:
          SITE_EVIDENCE_DIR: ${{ runner.temp }}/textbutler-site-evidence
          SUBJECT: ${{ needs.site_preflight.outputs.subject }}
          BASELINE: ${{ needs.site_preflight.outputs.baseline }}
          WORKFLOW: ${{ needs.site_preflight.outputs.workflow }}
          PRECONDITION: ${{ steps.precondition.outputs.receipt }}
          DENIAL: ${{ steps.deny.outputs.receipt }}
          ATTESTATION: ${{ steps.attest.outputs.receipt }}
          CONSUMPTION: ${{ steps.consume.outputs.receipt }}
          PROMOTION: ${{ steps.promote.outputs.receipt }}
          PROMOTION_OUTCOME: ${{ steps.promote.outcome }}
          CONSUMPTION_OUTCOME: ${{ steps.consume.outcome }}
        run: |
          node --input-type=module <<'SITE_EVIDENCE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const receipt = Object.fromEntries(['SUBJECT', 'BASELINE', 'WORKFLOW', 'PRECONDITION', 'DENIAL', 'ATTESTATION', 'CONSUMPTION', 'PROMOTION', 'PROMOTION_OUTCOME', 'CONSUMPTION_OUTCOME'].map(key => [key, process.env[key] ?? '']));
          const bytes = JSON.stringify(receipt);
          if (Buffer.byteLength(bytes) > 1024 * 1024) throw new Error('Site attempt receipts exceed bound');
          mkdirSync(process.env.SITE_EVIDENCE_DIR, { recursive: true, mode: 0o700 });
          writeFileSync(join(process.env.SITE_EVIDENCE_DIR, 'attempt.json'), bytes, { mode: 0o600, flag: 'wx' });
          SITE_EVIDENCE
      - name: Retain public site-attempt evidence
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: textbutler-site-attempt
          path: ${{ runner.temp }}/textbutler-site-evidence/attempt.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify denial, leased write, consumed status, revocations, and unchanged rules
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_DENIAL_RECEIPT: ${{ steps.deny.outputs.receipt }}
          SITE_PROMOTION_RECEIPT: ${{ steps.promote.outputs.receipt }}
          AUTHORITY_PRECONDITION_RECEIPT: ${{ steps.precondition.outputs.receipt }}
          AUTHORITY_ATTESTATION_RECEIPT: ${{ steps.attest.outputs.receipt }}
          AUTHORITY_CONSUMPTION_RECEIPT: ${{ steps.consume.outputs.receipt }}
        run: |
          set -euo pipefail
          sha256sum --check <<'SITE_AUTHORITY_HASHES'
          2694b0fcd4238da26cfb64eff15436e55fc16a7f04dd3f29083cc2bd5a024c4e  scripts/release-app-token.mjs
          efeb5bd9979315fda0e9b6d8e1b64d60ca363b79ec1c290204c90a4be25dc30c  scripts/release-status-attester.mjs
          6a1ee1d3a869a1e91c003f97270a81c35860b81fb73fb2c462c786f7916437ff  scripts/release-production-authority.mjs
          876c176fd0d203a091e8e6a819fc1656826c04a6d02a653b6b470aa8db641e7d  scripts/release-provider-outcome.mjs
          38c3f102b475b47bc4823060c13270234664b50d56160015e31cc4a224268591  scripts/release-ref-writer.mjs
          50f9feefba8aad4a831ab5ae1d3ac3e029f1b721cd813400742c82c7c6980df7  scripts/release-workflow-range.mjs
          bf7b7c1ec00cf2b61a4736a7ac25e244f12c9d70c3e25de9a2d2f66e30cbd91f  scripts/site-production-subject.mjs
          70dec16f999d28e3cb657c390094f1f82c26e0eaf034c05e4b46a8d8d72b3c4d  scripts/site-production.mjs
          SITE_AUTHORITY_HASHES
          node ./scripts/site-production.mjs finalize

  site_provider_outcome:
    if: ${{ always() && !cancelled() && needs.site_preflight.result == 'success' && ((needs.site_preflight.outputs.advance_required == 'true' && needs.site_write.result == 'success') || (needs.site_preflight.outputs.advance_required == 'false' && needs.site_write.result == 'skipped')) }}
    name: Verify the admitted site reached exact Vercel Production
    needs:
      - site_preflight
      - site_write
    permissions:
      contents: read
      actions: read
      statuses: read
      deployments: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SITE_SOURCE_SHA: ${{ inputs.site_sha }}
      SITE_CI_RUN_ID: ${{ inputs.site_ci_run_id }}
      SITE_CI_RUN_ATTEMPT: ${{ inputs.site_ci_run_attempt }}
      SITE_RELEASE_TAG: ${{ inputs.release_tag }}
      SITE_SUBJECT_RECEIPT: ${{ needs.site_preflight.outputs.subject }}
      SITE_BASELINE_RECEIPT: ${{ needs.site_preflight.outputs.baseline }}
      SITE_WORKFLOW_RECEIPT: ${{ needs.site_preflight.outputs.workflow }}
      SITE_DENIAL_RECEIPT: ${{ needs.site_write.outputs.denial }}
      SITE_PROMOTION_RECEIPT: ${{ needs.site_write.outputs.promotion }}
      AUTHORITY_PRECONDITION_RECEIPT: ${{ needs.site_write.outputs.precondition }}
      AUTHORITY_ATTESTATION_RECEIPT: ${{ needs.site_write.outputs.attestation }}
      AUTHORITY_CONSUMPTION_RECEIPT: ${{ needs.site_write.outputs.consumption }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Require stable REST and GraphQL provider success for this exact site
        if: needs.site_preflight.outputs.advance_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check <<'SITE_AUTHORITY_HASHES'
          2694b0fcd4238da26cfb64eff15436e55fc16a7f04dd3f29083cc2bd5a024c4e  scripts/release-app-token.mjs
          efeb5bd9979315fda0e9b6d8e1b64d60ca363b79ec1c290204c90a4be25dc30c  scripts/release-status-attester.mjs
          6a1ee1d3a869a1e91c003f97270a81c35860b81fb73fb2c462c786f7916437ff  scripts/release-production-authority.mjs
          876c176fd0d203a091e8e6a819fc1656826c04a6d02a653b6b470aa8db641e7d  scripts/release-provider-outcome.mjs
          38c3f102b475b47bc4823060c13270234664b50d56160015e31cc4a224268591  scripts/release-ref-writer.mjs
          50f9feefba8aad4a831ab5ae1d3ac3e029f1b721cd813400742c82c7c6980df7  scripts/release-workflow-range.mjs
          bf7b7c1ec00cf2b61a4736a7ac25e244f12c9d70c3e25de9a2d2f66e30cbd91f  scripts/site-production-subject.mjs
          70dec16f999d28e3cb657c390094f1f82c26e0eaf034c05e4b46a8d8d72b3c4d  scripts/site-production.mjs
          SITE_AUTHORITY_HASHES
          node ./scripts/site-production.mjs wait
      - name: Qualify an already-exact site without App credentials or any ref write
        if: needs.site_preflight.outputs.advance_required == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check <<'SITE_AUTHORITY_HASHES'
          2694b0fcd4238da26cfb64eff15436e55fc16a7f04dd3f29083cc2bd5a024c4e  scripts/release-app-token.mjs
          efeb5bd9979315fda0e9b6d8e1b64d60ca363b79ec1c290204c90a4be25dc30c  scripts/release-status-attester.mjs
          6a1ee1d3a869a1e91c003f97270a81c35860b81fb73fb2c462c786f7916437ff  scripts/release-production-authority.mjs
          876c176fd0d203a091e8e6a819fc1656826c04a6d02a653b6b470aa8db641e7d  scripts/release-provider-outcome.mjs
          38c3f102b475b47bc4823060c13270234664b50d56160015e31cc4a224268591  scripts/release-ref-writer.mjs
          50f9feefba8aad4a831ab5ae1d3ac3e029f1b721cd813400742c82c7c6980df7  scripts/release-workflow-range.mjs
          bf7b7c1ec00cf2b61a4736a7ac25e244f12c9d70c3e25de9a2d2f66e30cbd91f  scripts/site-production-subject.mjs
          70dec16f999d28e3cb657c390094f1f82c26e0eaf034c05e4b46a8d8d72b3c4d  scripts/site-production.mjs
          SITE_AUTHORITY_HASHES
          node ./scripts/site-production.mjs qualify
