      SITE_CI_RUN_ID: ${{ inputs.site_ci_run_id }}
      SITE_CI_RUN_ATTEMPT: ${{ inputs.site_ci_run_attempt }}
      SITE_RELEASE_TAG: ${{ inputs.release_tag }}
      SITE_SUBJECT_RECEIPT: ${{ needs.site_preflight.outputs.subject }}
      SITE_BASELINE_RECEIPT: ${{ needs.site_preflight.outputs.baseline }}
      SITE_WORKFLOW_RECEIPT: ${{ needs.site_preflight.outputs.workflow }}
    outputs:
      precondition: ${{ steps.precondition.outputs.receipt }}
      denial: ${{ steps.deny.outputs.receipt }}
      attestation: ${{ steps.attest.outputs.receipt }}
      consumption: ${{ steps.consume.outputs.receipt }}
      promotion: ${{ steps.promote.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Fetch only complete governed source and production histories
        run: |
          set -euo pipefail
          git -c credential.helper= -c core.hooksPath=/dev/null fetch --unshallow --no-tags             https://github.com/hraness/textbutler.git             refs/heads/main:refs/remotes/origin/main             refs/heads/website-production:refs/remotes/origin/website-production
      - name: Re-admit source artifact and control range before any App credential
        id: admitted
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_CONTROL_EPOCH_DIGEST: ${{ inputs.control_epoch_digest }}
        run: |
          set -euo pipefail
          sha256sum --check <<'SITE_AUTHORITY_HASHES'
          2694b0fcd4238da26cfb64eff15436e55fc16a7f04dd3f29083cc2bd5a024c4e  scripts/release-app-token.mjs
          efeb5bd9979315fda0e9b6d8e1b64d60ca363b79ec1c290204c90a4be25dc30c  scripts/release-status-attester.mjs
          6a1ee1d3a869a1e91c003f97270a81c35860b81fb73fb2c462c786f7916437ff  scripts/release-production-authority.mjs
          876c176fd0d203a091e8e6a819fc1656826c04a6d02a653b6b470aa8db641e7d  scripts/release-provider-outcome.mjs
          38c3f102b475b47bc4823060c13270234664b50d56160015e31cc4a224268591  scripts/release-ref-writer.mjs
          50f9feefba8aad4a831ab5ae1d3ac3e029f1b721cd813400742c82c7c6980df7  scripts/release-workflow-range.mjs
          bf7b7c1ec00cf2b61a4736a7ac25e244f12c9d70c3e25de9a2d2f66e30cbd91f  scripts/site-production-subject.mjs
          70dec16f999d28e3cb657c390094f1f82c26e0eaf034c05e4b46a8d8d72b3c4d  scripts/site-production.mjs
          SITE_AUTHORITY_HASHES
          node ./scripts/site-production.mjs workflow
      - name: Consume any pre-existing authority for the exact site target
        id: precondition
        env:
          TARGET: ${{ inputs.site_sha }}
          MLM_RELEASE_APP_PRIVATE_KEY: ${{ secrets.MLM_RELEASE_APP_PRIVATE_KEY }}
          MLM_RELEASE_APP_CLIENT_ID: ${{ vars.MLM_RELEASE_APP_CLIENT_ID }}
          MLM_RELEASE_APP_ID: ${{ vars.MLM_RELEASE_APP_ID }}
          MLM_RELEASE_APP_INSTALLATION_ID: ${{ vars.MLM_RELEASE_APP_INSTALLATION_ID }}
